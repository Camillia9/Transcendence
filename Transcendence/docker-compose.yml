services:
  mailhog:
    image: docker.io/mailhog/mailhog:latest
    container_name: transcendence_mailhog
    ports:
      - "8025:8025"
    networks:
      - backend-network
    restart: always

  nginx:
    build: ./nginx
    container_name: transcendence_nginx
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - frontend
      - identity-service
      - chat-service
      - workspace-service
    networks:
      - frontend-network
      - backend-network
    restart: always

  frontend:
    build: ./frontend
    container_name: transcendence_frontend
    networks:
      - frontend-network
    restart: always

  # Identity = auth, users, friends, profile, notifications inbox
  identity-service:
    build:
      context: ./services
      dockerfile: identity_service/Dockerfile
    container_name: transcendence_identity
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend-network
    environment:
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - WORKSPACE_URL=http://workspace-service:3003
      - CHAT_URL=http://chat-service:3002
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Chat = conversations, messages + sockets chat/status/notif rooms
  chat-service:
    build:
      context: ./services
      dockerfile: chat_service/Dockerfile
    container_name: transcendence_chat
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend-network
    environment:
      - PORT=3002
      - FRONTEND_URL=${FRONTEND_URL}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - WORKSPACE_URL=http://workspace-service:3003
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Workspace = organisations, invitations, projects, tasks, comments + kanban sockets
  workspace-service:
    build:
      context: ./services
      dockerfile: workspace_service/Dockerfile
    container_name: transcendence_workspace
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend-network
    environment:
      - PORT=3003
      - FRONTEND_URL=${FRONTEND_URL}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CHAT_URL=http://chat-service:3002
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: docker.io/library/postgres:16-alpine
    container_name: transcendence_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - backend-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./services
      dockerfile: identity_service/Dockerfile
    container_name: transcendence_migrate
    command: >
      sh -c "npx prisma migrate deploy --schema prisma/schema.prisma
      && npx prisma db seed"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FORCE_SEED=${FORCE_SEED:-0}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    restart: "no"

  # Backups Postgres automatiques (pg_dump + rotation)
  backup:
    image: docker.io/library/postgres:16-alpine
    container_name: transcendence_backup
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/backup-loop.sh:/scripts/backup-loop.sh:ro
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS}
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    restart: always

  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: transcendence_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend-network
    restart: always

  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: transcendence_postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy
    restart: always

  grafana:
    image: docker.io/grafana/grafana:11.2.2
    container_name: transcendence_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://localhost:8443/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - backend-network
    depends_on:
      - prometheus
    restart: always

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
