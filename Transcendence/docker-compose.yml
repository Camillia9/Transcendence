services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules

  auth-service:
    build:
      context: ./services
      dockerfile: auth_service/Dockerfile
    depends_on:
      - db
    ports:
      - "3001:3001"
    volumes:
      - ./services:/app:z
      - /app/node_modules
    environment:
      - PORT=3001
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=${DATABASE_URL}

  chat-service:
    build:
      context: ./services
      dockerfile: chat_service/Dockerfile
    depends_on:
      - db
    ports:
      - "3002:3002"
    volumes:
      - ./services:/app:z
      - /app/node_modules
    environment:
      - PORT=3002
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=${DATABASE_URL}

  project-service:
    build:
      context: ./services
      dockerfile: project_service/Dockerfile
    depends_on:
      - db
    ports:
      - "3003:3003"
    volumes:
      - ./services:/app:z
      - /app/node_modules
    environment:
      - PORT=3003
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=${DATABASE_URL}

  db:
    image: docker.io/library/postgres:16-alpine  # image officielle, rien à construire
    environment:                        # Postgres lit ces variables au démarrage
      POSTGRES_USER: ${POSTGRES_USER}   # ${...} = "va chercher dans le .env"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}       # crée automatiquement une base vide de ce nom
    ports:
      - "5432:5432"                     # Le port sur lequel Postgres ecoute. pour t'y connecter depuis TA machine
    volumes:
      - pgdata:/var/lib/postgresql/data # où Postgres range ses données

volumes:
  pgdata:                               # déclaration du volume nommé