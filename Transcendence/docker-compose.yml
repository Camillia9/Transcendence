services:
  nginx:
    build: ./nginx
    container_name: transcendence_nginx
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - frontend
      - auth-service
      - chat-service
      - project-service
    networks:
      - frontend-network
      - backend-network
    restart: always


  frontend:
    build: ./frontend
    container_name: transcendence_frontend
    networks:
      - frontend-network
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    restart: always

  auth-service:
    build:
      context: ./services
      dockerfile: auth_service/Dockerfile
    container_name: transcendence_auth
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend-network
    volumes:
      - ./services/auth_service:/app/auth_service:z
      - ./services/shared:/app/shared:z
      - ./services/prisma:/app/prisma:z
      - ./services/prisma.config.ts:/app/prisma.config.ts:z
      - /app/node_modules
    environment:
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}

  chat-service:
    build:
      context: ./services
      dockerfile: chat_service/Dockerfile
    container_name: transcendence_chat
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend-network
    volumes:
      - ./services/chat_service:/app/chat_service:z
      - ./services/shared:/app/shared:z
      - ./services/prisma:/app/prisma:z
      - ./services/prisma.config.ts:/app/prisma.config.ts:z
      - /app/node_modules
    environment:
      - PORT=3002
      - FRONTEND_URL=${FRONTEND_URL}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}

  project-service:
    build:
      context: ./services
      dockerfile: project_service/Dockerfile
    container_name: transcendence_project
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend-network
    volumes:
      - ./services/project_service:/app/project_service:z
      - ./services/shared:/app/shared:z
      - ./services/prisma:/app/prisma:z
      - ./services/prisma.config.ts:/app/prisma.config.ts:z
      - /app/node_modules
    environment:
      - PORT=3003
      - FRONTEND_URL=${FRONTEND_URL}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}

  db:
    image: docker.io/library/postgres:16-alpine  # image officielle, rien à construire
    container_name: transcendence_db
    environment:                        # Postgres lit ces variables au démarrage
      - POSTGRES_USER=${POSTGRES_USER}   # ${...} = "va chercher dans le .env"
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}       # crée automatiquement une base vide de ce nom
    networks:
      - backend-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./services
      dockerfile: auth_service/Dockerfile
    container_name: transcendence_migrate
    command: >
      sh -c "npx prisma migrate deploy --schema prisma/schema.prisma
      && npx prisma db seed"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    restart: "no"

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge

volumes:
  pgdata:                               # déclaration du volume nommé