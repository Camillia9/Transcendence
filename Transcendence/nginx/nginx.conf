events {
	worker_connections 1024;
}

http {
	include	   /etc/nginx/mime.types;
	default_type  application/octet-stream;

	# Logs
	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	# Redirection HTTP (Port 80) -> HTTPS (Port 443)
	server {
		listen 80;
		server_name localhost;
		return 301 https://$host$request_uri;
	}

	# Configuration HTTPS (Port 443)
	server {
		listen 443 ssl;
		server_name localhost;

		# Certificats SSL
		ssl_certificate	 /etc/nginx/ssl/cert.pem;
		ssl_certificate_key /etc/nginx/ssl/key.pem;

		# Protocoles & Ciphers sécurisés
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;

		# En-têtes de sécurité
		add_header X-Frame-Options "SAMEORIGIN";
		add_header X-XSS-Protection "1; mode=block";
		add_header X-Content-Type-Options "nosniff";

		# -------------------------------------------------------------------
		# 1. FRONTEND (Vite / React)
		# -------------------------------------------------------------------
		location / {
			proxy_pass http://frontend:5173;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Support du Hot Module Replacement (HMR) de Vite en dev
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

		# -------------------------------------------------------------------
		# 2. MICROSERVICE AUTH (Port 3001)
		# Auth, Utilisateurs, Profils, Amis, Organisations
		# -------------------------------------------------------------------
		location /api/auth/ {
			proxy_pass http://auth-service:3001;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/users/ {
			proxy_pass http://auth-service:3001;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/profile/ {
			proxy_pass http://auth-service:3001;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/friends/ {
			proxy_pass http://auth-service:3001;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/organisations/ {
			proxy_pass http://auth-service:3001;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# -------------------------------------------------------------------
		# 3. MICROSERVICE CHAT, NOTIFS & WEBSOCKETS (Port 3002)
		# -------------------------------------------------------------------
		location /api/conversations/ {
			proxy_pass http://chat-service:3002;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/messages/ {
			proxy_pass http://chat-service:3002;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Configuration critique pour les WebSockets / Socket.io
		location /socket.io/ {
			proxy_pass http://chat-service:3002/socket.io/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_read_timeout 86400; # Évite les déconnexions intempestives
		}

		# -------------------------------------------------------------------
		# 4. MICROSERVICE PROJECT / KANBAN (Port 3003)
		# Projets, Tâches, Commentaires
		# -------------------------------------------------------------------
		location /api/projects/ {
			proxy_pass http://project-service:3003;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}