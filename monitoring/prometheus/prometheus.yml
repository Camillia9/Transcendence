global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: identity
    static_configs:
      - targets: ["identity-service:3001"]

  - job_name: chat
    static_configs:
      - targets: ["chat-service:3002"]

  - job_name: workspace
    static_configs:
      - targets: ["workspace-service:3003"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
